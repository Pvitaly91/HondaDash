name: Build and test M3a two Nano bench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Pinned build tooling
        run: python -m pip install cmake==3.31.6
      - uses: jurplel/install-qt-action@v4.3.0
        with:
          version: '6.8.3'
          modules: qtserialport
          arch: win64_msvc2022_64
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          setup-python: false
          cache: true
      - name: Build Debug and Release, run all tests
        shell: pwsh
        run: ./scripts/build-windows.ps1 -QtPath $env:QT_ROOT_DIR
      - name: Simulation-only without SerialPort
        shell: pwsh
        run: |
          cmake -S . -B build/windows-simulation -G "Visual Studio 17 2022" -A x64 -DHONDADASH_WITH_SERIAL=OFF "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DCMAKE_DISABLE_FIND_PACKAGE_Qt6SerialPort=TRUE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows-simulation --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$env:QT_ROOT_DIR/bin;$env:PATH"
          ctest --test-dir build/windows-simulation -C Release --output-on-failure --output-junit "$PWD/build/windows-simulation/ctest.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Core-only without Qt
        shell: pwsh
        run: |
          cmake -S . -B build/windows-core -G "Visual Studio 17 2022" -A x64 -DHONDADASH_BUILD_GUI=OFF -DHONDADASH_BUILD_BRIDGE_CHECK=OFF -DHONDADASH_WITH_SERIAL=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows-core --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/windows-core -C Release --output-on-failure --output-junit "$PWD/build/windows-core/ctest.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Deploy and verify extracted Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -QtPath $env:QT_ROOT_DIR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HondaDash-windows-x64
          if-no-files-found: error
          path: |
            dist/HondaDash-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HondaDash-windows-test-reports
          if-no-files-found: error
          path: |
            dist/reports/
            build/windows-simulation/ctest.xml
            build/windows-core/ctest.xml
            build/windows/bench-integration-reports/
            build/windows/reports/
            build/windows/Testing/Temporary/LastTest.log
            build/windows/smoke*.json
            build/windows/smoke*.png
            build/windows/dashboard*.png
            build/windows/timing-reports/
            build/windows/acceptance-reports/
            build/windows/acceptance-native-cli/
            build/windows-simulation/timing-reports/
            build/windows-simulation/acceptance-reports/
            build/windows-simulation/acceptance-native-cli/

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Pinned build tooling
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - uses: jurplel/install-qt-action@v4.3.0
        with:
          version: '6.8.3'
          modules: qtserialport
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          setup-python: false
          cache: true
      - name: Build the same libraries and GUI
        run: |
          cmake --version
          g++ --version
          cmake --preset linux -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build/linux --parallel 2
      - name: Logic and offscreen GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build/linux --output-on-failure --output-junit "$PWD/build/linux/ctest-linux.xml"
      - name: Linux simulation-only without SerialPort
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build/linux-simulation -G Ninja -DCMAKE_BUILD_TYPE=Release -DHONDADASH_WITH_SERIAL=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Qt6SerialPort=TRUE -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build/linux-simulation --parallel 2
          ctest --test-dir build/linux-simulation --output-on-failure --output-junit "$PWD/build/linux-simulation/ctest.xml"
      - name: Linux core-only without Qt
        run: |
          cmake -S . -B build/linux-core -G Ninja -DCMAKE_BUILD_TYPE=Release -DHONDADASH_BUILD_GUI=OFF -DHONDADASH_BUILD_BRIDGE_CHECK=OFF -DHONDADASH_WITH_SERIAL=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          cmake --build build/linux-core --parallel 2
          ctest --test-dir build/linux-core --output-on-failure --output-junit "$PWD/build/linux-core/ctest.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HondaDash-linux-test-reports
          if-no-files-found: error
          path: |
            build/linux/ctest-linux.xml
            build/linux-core/ctest.xml
            build/linux/bench-integration-reports/
            build/linux/Testing/Temporary/LastTest.log
            build/linux/*smoke*.json
            build/linux/smoke*.png
            build/linux/*offscreen*.png
            build/linux-simulation/ctest.xml
            build/linux-simulation/smoke*.json
            build/linux-simulation/smoke*.png
            build/linux/timing-reports/
            build/linux/acceptance-reports/
            build/linux/acceptance-native-cli/
            build/linux/acceptance-pty-reports/
            build/linux-simulation/timing-reports/
            build/linux-simulation/acceptance-reports/
            build/linux-simulation/acceptance-native-cli/

  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Arduino CLI 1.2.2, AVR Boards 1.8.6, four firmwares and both Nano targets
        run: bash scripts/build-firmware.sh --bootstrap --firmware all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HondaDash-nano-firmware
          if-no-files-found: error
          path: |
            build/firmware/**/*.ino.hex
            build/firmware/**/*.ino.elf
            build/firmware/**/*.map
            build/firmware/**/*.json
            build/firmware/**/*.txt
            build/firmware/**/*.su
            build/firmware/**/*.o
            build/firmware/**/*.a
            docs/licenses/firmware/
            firmware/nano_synthetic/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HondaDash-nano-dlc-bridge-lab-firmware
          if-no-files-found: error
          path: |
            build/firmware-bridge-lab/**/*.ino.hex
            build/firmware-bridge-lab/**/*.ino.elf
            build/firmware-bridge-lab/**/*.map
            build/firmware-bridge-lab/**/*.json
            build/firmware-bridge-lab/**/*.txt
            build/firmware-bridge-lab/**/*.su
            build/firmware-bridge-lab/**/*.o
            build/firmware-bridge-lab/**/*.a
            docs/licenses/firmware/
            firmware/nano_dlc_bridge_lab/
            firmware/shared/reference_fixtures.hpp
            firmware/shared/bench_wire.hpp
            docs/NANO_DLC_BRIDGE_*.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HondaDash-nano-dlc-bridge-bench-firmware
          if-no-files-found: error
          path: |
            build/firmware-bridge-bench/**/*.ino.hex
            build/firmware-bridge-bench/**/*.ino.elf
            build/firmware-bridge-bench/**/*.map
            build/firmware-bridge-bench/**/*.json
            build/firmware-bridge-bench/**/*.txt
            build/firmware-bridge-bench/**/*.su
            build/firmware-bridge-bench/**/*.o
            build/firmware-bridge-bench/**/*.a
            docs/licenses/firmware/
            firmware/nano_dlc_bridge_bench/
            firmware/nano_dlc_bridge_lab/
            firmware/shared/
            docs/TWO_NANO_BENCH.md
            docs/ONE_WIRE_DRIVER.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HondaDash-nano-dlc-responder-bench-firmware
          if-no-files-found: error
          path: |
            build/firmware-responder-bench/**/*.ino.hex
            build/firmware-responder-bench/**/*.ino.elf
            build/firmware-responder-bench/**/*.map
            build/firmware-responder-bench/**/*.json
            build/firmware-responder-bench/**/*.txt
            build/firmware-responder-bench/**/*.su
            build/firmware-responder-bench/**/*.o
            build/firmware-responder-bench/**/*.a
            docs/licenses/firmware/
            firmware/nano_dlc_responder_bench/
            firmware/nano_dlc_bridge_lab/
            firmware/shared/
            docs/TWO_NANO_BENCH.md
            docs/ONE_WIRE_DRIVER.md
      - uses: actions/upload-artifact@v4
        with:
          name: HondaDash-two-nano-bench-hardware
          if-no-files-found: error
          path: |
            hardware/two_nano_bench/
            docs/TWO_NANO_ACCEPTANCE.md
